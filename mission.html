<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission · IELTS Quest</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f7fb;
  color:#202334;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
  height:82px;
  background:#fff;
  border-bottom:1px solid #e6e8ef;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#5145e5;
  cursor:pointer;
}

.header-right{
  color:#777b8c;
  font-size:14px;
}

main{
  width:min(960px,90%);
  margin:44px auto 90px;
}

.card{
  background:#fff;
  border:1px solid #e7e8ef;
  border-radius:22px;
  padding:34px;
  margin-bottom:22px;
  box-shadow:0 5px 20px rgba(40,42,60,.04);
}

.hidden{
  display:none !important;
}

.eyebrow{
  color:#5145e5;
  font-size:14px;
  font-weight:800;
  letter-spacing:.05em;
  margin-bottom:10px;
}

h1{
  font-size:38px;
  margin:0 0 12px;
  line-height:1.2;
}

h2{
  font-size:25px;
  margin:0 0 18px;
}

h3{
  margin:0 0 10px;
}

.meta{
  color:#777b8c;
  margin-bottom:25px;
}

.progress{
  width:100%;
  height:8px;
  background:#ececf5;
  border-radius:999px;
  overflow:hidden;
  margin-top:22px;
}

.progress span{
  display:block;
  height:100%;
  background:#5145e5;
  border-radius:999px;
}

.story{
  font-family:Georgia,"Times New Roman",serif;
  font-size:23px;
  line-height:2.05;
  color:#282a37;
}

.story p{
  margin:0 0 18px;
}

.target-word{
  color:#5145e5;
  font-weight:700;
  border-bottom:2px dotted #5145e5;
  cursor:pointer;
}

.support-word{
  cursor:pointer;
  background:#f2f2f7;
  border-radius:5px;
  padding:1px 3px;
}

.word-tip{
  margin-top:22px;
  padding:17px 19px;
  border-radius:14px;
  background:#f7f6ff;
  border:1px solid #dedafd;
}

.word-tip-title{
  font-size:20px;
  font-weight:800;
  color:#5145e5;
}

.word-tip-ipa{
  color:#666b7c;
  margin:4px 0;
}

.word-tip-meaning{
  font-size:15px;
}

.vocab-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.vocab-item{
  border:1px solid #e7e8ef;
  border-radius:14px;
  padding:15px;
}

.vocab-word{
  font-weight:800;
  font-size:18px;
}

.vocab-ipa{
  color:#777b8c;
  margin:4px 0;
}

.vocab-meaning{
  font-size:14px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 21px;
  font-size:15px;
  font-weight:750;
  cursor:pointer;
}

.primary{
  background:#5145e5;
  color:#fff;
}

.secondary{
  background:#eeeeF6;
  color:#34364a;
}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.quiz-intro{
  color:#686c7e;
  line-height:1.7;
}

.question{
  padding:22px 0;
  border-bottom:1px solid #ececf2;
}

.question:last-child{
  border-bottom:0;
}

.question-number{
  font-size:13px;
  color:#888c9d;
  margin-bottom:10px;
}

.question-sentence{
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  line-height:2;
}

.answer-input{
  width:150px;
  max-width:45vw;
  padding:8px 10px;
  margin:0 5px;
  border-radius:9px;
  border:2px solid #c9cad5;
  font-family:inherit;
  font-size:18px;
  text-align:center;
  outline:none;
}

.answer-input:focus{
  border-color:#5145e5;
}

.answer-input.correct{
  border-color:#27a865;
  background:#effbf4;
}

.answer-input.wrong{
  border-color:#e05252;
  background:#fff1f1;
}

.answer-note{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:13px;
  margin-top:7px;
}

.answer-note.correct{
  color:#218653;
}

.answer-note.wrong{
  color:#c83d3d;
}

.result-score{
  font-size:54px;
  font-weight:850;
  color:#5145e5;
  margin:8px 0;
}

.translation-sentence{
  padding:18px 0;
  border-bottom:1px solid #ececf2;
}

.translation-sentence:last-child{
  border-bottom:0;
}

.translation-en{
  font-family:Georgia,"Times New Roman",serif;
  font-size:20px;
  line-height:1.7;
}

.translation-zh{
  margin-top:7px;
  color:#686c7e;
  line-height:1.7;
}

.mission-nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.mission-chip{
  background:#fff;
  color:#55596b;
  border:1px solid #dddfea;
}

.mission-chip.active{
  background:#5145e5;
  color:#fff;
  border-color:#5145e5;
}

.saved-info{
  margin-top:14px;
  font-size:13px;
  color:#777b8c;

@media(max-width:700px){
  header{
    padding:0 5%;
  }

  main{
    width:92%;
    margin-top:25px;
  }

  .card{

  }

<body>

<header>
  <div class="logo" onclick="goHome()">IELTS Quest</div>
  <div class="header-right">Story-based IELTS Vocabulary Learning</div>
</header>

<main>

  <div class="mission-nav" id="missionNav"></div>

  <!-- STORY VIEW -->
  <section id="storyView">

    <div class="card">
      <div class="eyebrow" id="missionNumber"></div>

      <h1 id="missionTitle"></h1>

      <div class="meta" id="missionMeta"></div>

      <div class="progress">
        <span id="missionProgress"></span>
      </div>

      <div class="saved-info" id="savedInfo"></div>
    </div>

    <div class="card">
      <h2>Story</h2>

      <p style="color:#777b8c;line-height:1.7;">
        先阅读完整故事。紫色虚线词是本 Mission 的核心学习词；
        部分辅助词也可以点击查看释义。
      </p>

      <div class="story" id="storyContent"></div>

      <div id="wordTip" class="word-tip hidden"></div>
    </div>

    <div class="card">
      <h2>Core Vocabulary</h2>

      <div class="vocab-grid" id="vocabList"></div>

      <div class="button-row">
        <button class="primary" onclick="startQuiz()">开始测试</button>
      </div>
    </div>

  </section>


  <!-- QUIZ VIEW -->
  <section id="quizView" class="hidden">

    <div class="card">
      <div class="eyebrow">QUIZ</div>

      <h1 id="quizTitle"></h1>

      <p class="quiz-intro">
        测试仍然保留故事中的完整句子。
        系统只会把本次考核的目标词替换成输入框，
        句子的其他内容不会删除。
      </p>
    </div>

    <div class="card">
      <div id="quizQuestions"></div>

      <div class="button-row">
        <button class="primary" onclick="submitQuiz()">提交答案</button>
        <button class="secondary" onclick="backToStory()">返回文章</button>
      </div>
    </div>

    <div id="resultCard" class="card hidden">

      <div class="eyebrow">RESULT</div>

      <h2>本次测试结果</h2>

      <div class="result-score" id="scoreText">0%</div>

      <p id="scoreDetail"></p>

      <div class="button-row">
        <button class="primary" onclick="submitQuiz()">修改后再次提交</button>

        <button
          class="secondary"
          id="translationButton"
          onclick="showTranslation()"
        >
          查看完整文章与翻译
        </button>

        <button class="secondary" onclick="finishMission()">Finish</button>
      </div>
    </div>

    <div id="translationPanel" class="card hidden">

      <div class="eyebrow">FULL STORY & TRANSLATION</div>

      <h2>完整文章与逐句翻译</h2>

      <p style="color:#777b8c;line-height:1.7;">
        完成测试后，可以在这里重新阅读完整英文，
        并对照每一句中文翻译。
      </p>

      <div id="translationContent"></div>

      <div class="button-row">
        <button class="primary" onclick="finishMission()">Finish</button>
      </div>
    </div>

  </section>

</main>

/* =========================================================
   STATE
   ========================================================= */

let currentMissionId =
  Number(localStorage.getItem("ieltsQuestCurrentMission")) || 2;

let currentMission =
  missions.find(m => m.id === currentMissionId) || missions[1];

let submitted = false;


/* =========================================================
   STORAGE
   ========================================================= */

function storageKey(){
  return "ieltsQuestMission_" + currentMission.id;
}

function getSavedState(){
  try{
    return JSON.parse(localStorage.getItem(storageKey())) || {
      answers:{},
      bestScore:0,
      attempts:0,
      completed:false
    };
  }catch(e){
    return {
      answers:{},
      bestScore:0,
      attempts:0,
      completed:false
    };
  }
}

function saveState(state){
  localStorage.setItem(storageKey(),JSON.stringify(state));
}


/* =========================================================
   TEXT HELPERS
   ========================================================= */

function escapeRegExp(text){
  return text.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function markWords(sentence){

  let output = sentence;

  const allWords = [
    ...currentMission.coreWords.map(w => ({
      ...w,
      type:"target"
    })),
    ...currentMission.supportWords.map(w => ({
      ...w,
      type:"support"
    }))
  ];

  allWords.sort((a,b) => b.word.length - a.word.length);

  allWords.forEach(item => {

    const regex =
      new RegExp("\\b(" + escapeRegExp(item.word) + ")\\b","gi");

    output = output.replace(
      regex,
      function(match){

        const cls =
          item.type === "target"
          ? "target-word"
          : "support-word";

        return `<span
          class="${cls}"
          onclick="showWordInfo('${item.word.replace(/'/g,"\\'")}')"
        >${match}</span>`;
      }
    );
  });

  return output;
}


/* =========================================================
   MISSION NAVIGATION
   ========================================================= */

function renderMissionNav(){

  const nav = document.getElementById("missionNav");

  nav.innerHTML = "";

  missions.forEach(mission => {

    const button = document.createElement("button");

    button.className =
      "mission-chip" +
      (mission.id === currentMission.id ? " active" : "");

    button.textContent =
      "Mission " + mission.id;

    button.onclick = () => {
      switchMission(mission.id);
    };

    nav.appendChild(button);
  });
}

function switchMission(id){

  currentMissionId = id;

  currentMission =
    missions.find(m => m.id === id);

  localStorage.setItem(
    "ieltsQuestCurrentMission",
    String(id)
  );

  submitted = false;

  renderAll();

  showStory();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   STORY
   ========================================================= */

function renderStory(){

  document.getElementById("missionNumber").textContent =
    "MISSION " + currentMission.id;

  document.getElementById("missionTitle").textContent =
    currentMission.title;

  document.getElementById("missionMeta").textContent =
    currentMission.level +
    " · " +
    currentMission.time;

  document.getElementById("missionProgress").style.width =
    currentMission.progress + "%";

  const saved = getSavedState();

  const savedInfo =
    document.getElementById("savedInfo");

  if(saved.attempts > 0){

    savedInfo.textContent =
      "学习记录：已测试 " +
      saved.attempts +
      " 次 · 最高正确率 " +
      saved.bestScore +
      "%" +
      (saved.completed ? " · 已完成" : "");

  }else{

    savedInfo.textContent =
      "尚未进行测试。";

  }

  const story =
    document.getElementById("storyContent");

  story.innerHTML =
    currentMission.sentences
      .map(item =>
        `<p>${markWords(item.en)}</p>`
      )
      .join("");

  document.getElementById("wordTip")
    .classList.add("hidden");
}


/* =========================================================
   VOCABULARY
   ========================================================= */

function renderVocabulary(){

  const container =
    document.getElementById("vocabList");

  container.innerHTML =
    currentMission.coreWords
      .map(item => `
        <div class="vocab-item">
          <div class="vocab-word">
            ${item.word}
          </div>

          <div class="vocab-ipa">
            ${item.ipa}
          </div>

          <div class="vocab-meaning">
            ${item.meaning}
          </div>
        </div>
      `)
      .join("");
}


/* =========================================================
   WORD INFO
   ========================================================= */

function showWordInfo(word){

  const item =
    currentMission.coreWords.find(
      w => w.word.toLowerCase() === word.toLowerCase()
    )
    ||
    currentMission.supportWords.find(
      w => w.word.toLowerCase() === word.toLowerCase()
    );

  if(!item) return;

  const tip =
    document.getElementById("wordTip");

  tip.innerHTML = `
    <div class="word-tip-title">
      ${item.word}
    </div>

    <div class="word-tip-ipa">
      ${item.ipa}
    </div>

    <div class="word-tip-meaning">
      ${item.meaning}
    </div>
  `;

  tip.classList.remove("hidden");
}


/* =========================================================
   QUIZ GENERATION
   关键修复：
   直接读取完整 Story sentence，
   只替换考核词，不删除其他句子内容。
   ========================================================= */

function createQuizSentence(wordData,index){

  const fullSentence =
    currentMission.sentences[wordData.sentence].en;

  const regex =
    new RegExp(
      "\\b" +
      escapeRegExp(wordData.word) +
      "\\b",
      "i"
    );

  const saved = getSavedState();

  const savedAnswer =
    saved.answers[index] || "";

  const input = `
    <input
      class="answer-input"
      id="answer-${index}"
      type="text"
      autocomplete="off"
      spellcheck="false"
      value="${savedAnswer.replace(/"/g,"&quot;")}"
      aria-label="Question ${index + 1}"
    >
  `;

  return fullSentence.replace(regex,input);
}


function renderQuiz(){

  document.getElementById("quizTitle").textContent =
    currentMission.title;

  const container =
    document.getElementById("quizQuestions");

  container.innerHTML =
    currentMission.coreWords
      .map((wordData,index) => {

        return `
          <div class="question">

            <div class="question-number">
              Question ${index + 1}
            </div>

            <div class="question-sentence">
              ${createQuizSentence(wordData,index)}
            </div>

            <div
              class="answer-note"
              id="note-${index}"
            ></div>

          </div>
        `;

      })
      .join("");
}


/* =========================================================
   QUIZ ACTIONS
   ========================================================= */

function startQuiz(){

  renderQuiz();

  document.getElementById("storyView")
    .classList.add("hidden");

  document.getElementById("quizView")
    .classList.remove("hidden");

  document.getElementById("resultCard")
    .classList.add("hidden");

  document.getElementById("translationPanel")
    .classList.add("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function submitQuiz(){

  let correctCount = 0;

  const state =
    getSavedState();

  const answers = {};

  currentMission.coreWords.forEach(
    (wordData,index) => {

      const input =
        document.getElementById(
          "answer-" + index
        );

      const note =
        document.getElementById(
          "note-" + index
        );

      if(!input) return;

      const answer =
        input.value.trim();

      answers[index] = answer;

      const isCorrect =
        answer.toLowerCase() ===
        wordData.answer.toLowerCase();

      input.classList.remove(
        "correct",
        "wrong"
      );

      note.classList.remove(
        "correct",
        "wrong"
      );

      if(isCorrect){

        correctCount++;

        input.classList.add("correct");

        note.classList.add("correct");

        note.textContent = "✓ 正确";

      }else{

        input.classList.add("wrong");

        note.classList.add("wrong");

        note.textContent =
          "正确答案：" +
          wordData.answer;

      }
    }
  );

  const total =
    currentMission.coreWords.length;

  const score =
    Math.round(
      correctCount / total * 100
    );

  state.answers = answers;

  state.attempts =
    (state.attempts || 0) + 1;

  state.bestScore =
    Math.max(
      state.bestScore || 0,
      score
    );

  if(score === 100){
    state.completed = true;
  }

  saveState(state);

  submitted = true;

  document.getElementById("scoreText")
    .textContent = score + "%";

  document.getElementById("scoreDetail")
    .textContent =
      "答对 " +
      correctCount +
      " / " +
      total +
      " 题。你可以直接修改红色答案框，然后再次提交。逐句中文翻译现已解锁。";

  document.getElementById("resultCard")
    .classList.remove("hidden");

  document.getElementById("resultCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}


/* =========================================================
   TRANSLATION
   修复：
   点击按钮后真正生成完整文章与逐句翻译。
   ========================================================= */

function showTranslation(){

  if(!submitted){

    alert("请先提交一次答案。");

    return;
  }

  const panel =
    document.getElementById(
      "translationPanel"
    );

  const content =
    document.getElementById(
      "translationContent"
    );

  content.innerHTML =
    currentMission.sentences
      .map((item,index) => `

        <div class="translation-sentence">

          <div class="translation-en">
            ${index + 1}. ${item.en}
          </div>

          <div class="translation-zh">
            ${item.zh}
          </div>

        </div>

      `)
      .join("");

  panel.classList.remove("hidden");

  panel.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* =========================================================
   FINISH
   保留学习记录，不清空答案。
   ========================================================= */

function finishMission(){

  const state =
    getSavedState();

  state.completed = true;

  saveState(state);

  submitted = false;

  renderStory();

  showStory();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   RETURN
   ========================================================= */

function backToStory(){

  saveCurrentInputs();

  showStory();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function saveCurrentInputs(){

  const state =
    getSavedState();

  const answers =
    state.answers || {};

  currentMission.coreWords.forEach(
    (wordData,index) => {

      const input =
        document.getElementById(
          "answer-" + index
        );

      if(input){
        answers[index] =
          input.value;
      }
    }
  );

  state.answers = answers;

  saveState(state);
}


/* =========================================================
   VIEW
   ========================================================= */

function showStory(){

  document.getElementById("storyView")
    .classList.remove("hidden");

  document.getElementById("quizView")
    .classList.add("hidden");
}


function goHome(){

  window.location.href =
    "index.html";
}


/* =========================================================
   RENDER
   ========================================================= */

function renderAll(){

  renderMissionNav();

  renderStory();

  renderVocabulary();
}


/* =========================================================
   START
   ========================================================= */

renderAll();
showStory();

</script>
